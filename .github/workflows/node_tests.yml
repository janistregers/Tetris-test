name: Node.js CI

on: [push, pull_request] # Reaģēs uz jebkuru zaru

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Tetris Logic Tests
      run: node tetris_logic.test.js