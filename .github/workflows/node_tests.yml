name: Node.js CI

# Norādām, pie kuriem notikumiem palaist testus
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    # Izmantojam jaunāko Ubuntu serveri
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Izvēlies savu Node versiju

    - name: Install dependencies
      run: npm install # Ja tev ir package.json, ja nav - šo var izlaist

    - name: Run Tetris Logic Tests
      run: node tetris_logic.test.js