name: Node.js CI

on:
  push:
    branches: [ dev, master, main ] # Pievienojām 'dev' sarakstā
  pull_request:
    branches: [ dev, master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Tetris Logic Tests
      run: node tetris_logic.test.js